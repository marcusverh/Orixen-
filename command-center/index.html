<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orixen Command Center</title>
<meta name="description" content="Votre acquisition. Vos opportunités. Votre croissance.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orixen">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/favicon.ico?v=3" sizes="48x48">
<link rel="icon" href="/assets/logo.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=3">
<link rel="manifest" href="/command-center/manifest.webmanifest">
<script>
(function(){var t;try{t=localStorage.getItem('cc-theme')}catch(e){}
if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t)})();
</script>
<link rel="preload" href="/assets/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/command-center/cc.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Navigation principale">
    <div class="brand"><img src="/assets/icon-192.png" alt=""><div><b>Orixen</b><span>Command Center</span></div></div>
    <div class="client"><b id="s-ent"></b><span id="s-met"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <a class="am" href="#/equipe"><span class="av">MV</span><div><b>Marcus Verhaar</b><span>Votre responsable</span></div></a>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <a class="mob-brand" href="#/"><img src="/assets/icon-192.png" alt="Orixen"></a>
      <h1 id="title">Vue d'ensemble</h1>
      <label class="chip hide-m" title="Période analysée"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        <select id="period" aria-label="Période analysée">
          <option value="30">30 derniers jours</option>
          <option value="mois">Mois en cours</option>
          <option value="trim">Trimestre</option>
          <option value="perso">Période personnalisée</option>
        </select>
      </label>
      <a class="chip" id="pulse-chip" href="#/systeme" title="État du système"></a>
      <button class="icon-btn" id="theme" aria-label="Changer de thème"></button>
      <button class="ask" id="ask"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span>Orixen Intelligence</span><kbd>Ctrl K</kbd></button>
    </header>
    <div class="demo"><b>Démonstration</b> · Toitures Martin est une entreprise fictive. Données d'exemple, aucune donnée réelle.</div>
    <main class="page" id="page" tabindex="-1"></main>
  </div>
</div>

<nav class="tab" id="tab" aria-label="Navigation"></nav>
<div class="sheet" id="sheet" role="dialog" aria-label="Plus de rubriques"><div class="grab"></div><div id="sheet-b"></div></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Fiche prospect"></aside>
<div class="ai" id="ai" role="dialog" aria-label="Orixen Intelligence"><div class="ai-box"><div class="ai-in"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4z"/></svg><input id="ai-q" placeholder="Posez une question sur votre activité" autocomplete="off"><button class="btn sm" id="ai-x">Fermer</button></div><div class="ai-b" id="ai-b"></div></div></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/command-center/cc-data.js"></script>
<script src="/command-center/cc.js"></script>
</body>
</html>
